title: "[失效] "
body:
  - type: markdown
    attributes:
      value: |
        该屏蔽的没屏蔽、或者不该动的区域被误伤了，都发这里。

        这个项目的排查方式是**先复现、拿实测数据说话**，所以下面几项请尽量填全 ——
        填不全我大概率复现不出来，只能先放着。

        Reports in English are fine too; please fill in as much as you can.
  - type: input
    id: version
    attributes:
      label: 扩展版本号 / Version
      description: 设置页页脚，或者 edge://extensions/ 里能看到
      placeholder: "1.6.1"
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 出问题的页面地址 / Page URL
      description: 地址栏里的完整地址。B 站是单页应用，从别的页面点进去和直接打开，DOM 可能不一样。
      placeholder: "https://www.bilibili.com/video/BV..."
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 是哪一种
      options:
        - 该屏蔽的没屏蔽 / Something that should be blocked wasn't
        - 误伤了不该动的区域 / Something got hidden that shouldn't be
        - 遮罩或残留占位不对 / Mask or leftover placeholder looks wrong
        - 统计数字不对 / The blocked counter looks wrong
        - 其它 / Other
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 具体现象
      description: 在页面哪个位置、大概多大、一共有几块、开关是开还是关。有截图直接拖进来最好。
      placeholder: |
        位置：播放器下方那条横幅
        现象：「屏蔽播放器页面的广告」是开着的，但广告还在
        尺寸：约 880 × 73
        截图：…
    validations:
      required: true
  - type: textarea
    id: element
    attributes:
      label: 元素信息（DevTools 拿得到就贴，拿不到写「拿不到」）
      description: Elements 面板里右键那个元素 → Copy → Copy selector；再把它的 tag / id / class 和实测尺寸一起贴上。
      placeholder: |
        selector: a.ad-report.strip-ad.left-banner
        尺寸: 880 × 73
        祖先链: …
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: 调试日志（可选）
      description: 设置页打开「输出调试日志到控制台」，复现一次，把控制台里带 [B站屏蔽助手] 的行贴上来。
    validations:
      required: false
