title: "[求助] "
body:
  - type: markdown
    attributes:
      value: |
        装不上、不会用、设置找不到，都可以在这里问。

        发帖前先翻一眼常见问题 —— 高频问题基本都在那儿：
        [README.zh-CN.md](../blob/main/README.zh-CN.md) / [README.en.md](../blob/main/README.en.md)

        用英文提问也行 —— 下面几项顺手填一下。
        English is fine too — fill in the items below while you're at it.
  - type: input
    id: version
    attributes:
      label: 扩展版本号 / Version
      description: 设置页页脚，或者 edge://extensions/ 里能看到，形如 1.6.1
      placeholder: "1.6.1"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: 浏览器 / Browser
      options:
        - Microsoft Edge
        - Google Chrome
        - 其它 Chromium 内核浏览器 / Other Chromium
    validations:
      required: true
  - type: dropdown
    id: installed
    attributes:
      label: 是怎么装的 / How it was installed
      options:
        - Microsoft Edge 加载项商店 / Edge Add-ons store
        - 下载 zip 手动加载 / Loaded unpacked from a zip
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么、期待什么、实际是什么。跟某个页面有关的话，把页面地址也贴上。
      placeholder: |
        1. 打开 …
        2. 我期待 …
        3. 实际 …
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 已经试过什么（可选）
      description: 比如重开浏览器、换个页面、看控制台有没有报错。「试过但没用」也是有用的信息。
    validations:
      required: false
